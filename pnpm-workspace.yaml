# Single-package project — no `packages:` globs needed.
# esbuild's postinstall only downloads its own platform-specific binary (no arbitrary
# code from a third party) — safe to approve, and required: a fresh install with no local
# pnpm store (e.g. Vercel, or `rm -rf node_modules && pnpm install`) fails outright with
# ERR_PNPM_IGNORED_BUILDS otherwise, since a non-interactive `pnpm install` can't prompt
# for `pnpm approve-builds`. Generated by running `pnpm approve-builds esbuild` — if a
# future dependency adds a postinstall script, regenerate the same way rather than
# hand-editing this key, since pnpm 11 writes it under `allowBuilds`, not the older
# `onlyBuiltDependencies` field.
allowBuilds:
  esbuild: true
1